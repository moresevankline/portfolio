  <text x="1204" y="710" font-size="18" fill="#555">Q&amp;A · 45 min</text>
  <text x="1204" y="790" font-size="20" fill="#555">Homework</text>
  <text x="1520" y="790" font-size="20" text-anchor="end" fill="#111">1 to review</text>
