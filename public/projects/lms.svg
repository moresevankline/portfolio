<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- Placeholder preview: a generic course page. Replace with a real screenshot of the demo. -->
  <rect width="1600" height="1000" fill="#f4f4f4"/>
  <!-- sidebar -->
  <rect width="300" height="1000" fill="#ececec"/>
  <rect x="40" y="44" width="36" height="36" rx="8" fill="#1a1a1a"/>
  <text x="92" y="69" font-size="22" font-weight="700" fill="#1a1a1a">Coursebook</text>
  <rect x="28" y="136" width="244" height="48" rx="8" fill="#dcdcdc"/>
  <text x="56" y="167" font-size="19" fill="#1a1a1a">Overview</text>
  <text x="56" y="231" font-size="19" fill="#555">My courses</text>
  <text x="56" y="287" font-size="19" fill="#555">Progress</text>
  <text x="56" y="343" font-size="19" fill="#555">Homework</text>
  <text x="56" y="399" font-size="19" fill="#555">Schedule</text>
  <text x="56" y="455" font-size="19" fill="#555">Recordings</text>
  <circle cx="60" cy="940" r="20" fill="#cfcfcf"/>
  <text x="92" y="947" font-size="18" fill="#555">Student</text>
  <!-- main -->
  <text x="364" y="112" font-size="40" font-weight="700" fill="#111">Getting started</text>
  <text x="364" y="156" font-size="20" fill="#555">4 modules · 18 lessons · about 2 h 40 m</text>
  <rect x="364" y="196" width="760" height="12" rx="6" fill="#dddddd"/>
  <rect x="364" y="196" width="304" height="12" rx="6" fill="#1a1a1a"/>
  <text x="1140" y="208" font-size="18" fill="#555">40% complete</text>
  <!-- module list -->
  <g font-size="21">
    <rect x="364" y="258" width="760" height="600" rx="14" fill="#ffffff"/>
    <text x="400" y="312" font-weight="700" fill="#111">Module 1 · Welcome</text>
    <text x="1088" y="312" text-anchor="end" fill="#555">Done</text>
    <rect x="400" y="342" width="688" height="1" fill="#e6e6e6"/>
    <text x="400" y="392" font-weight="700" fill="#111">Module 2 · Your first course</text>
    <text x="1088" y="392" text-anchor="end" fill="#555">3 of 5</text>
    <g fill="#333" font-size="19">
      <circle cx="414" cy="437" r="9" fill="#1a1a1a"/><text x="440" y="444">Create a course</text>
      <circle cx="414" cy="487" r="9" fill="#1a1a1a"/><text x="440" y="494">Add modules and lessons</text>
      <circle cx="414" cy="537" r="9" fill="#1a1a1a"/><text x="440" y="544">Upload video and files</text>
      <circle cx="414" cy="587" r="9" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="440" y="594">Set homework</text>
      <circle cx="414" cy="637" r="9" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="440" y="644">Publish to students</text>
    </g>
    <rect x="400" y="676" width="688" height="1" fill="#e6e6e6"/>
    <text x="400" y="726" font-weight="700" fill="#111">Module 3 · Reviewing work</text>
    <text x="1088" y="726" text-anchor="end" fill="#555">0 of 6</text>
    <rect x="400" y="756" width="688" height="1" fill="#e6e6e6"/>
    <text x="400" y="806" font-weight="700" fill="#111">Module 4 · Live sessions</text>
    <text x="1088" y="806" text-anchor="end" fill="#555">0 of 4</text>
  </g>
  <!-- right rail -->
  <rect x="1172" y="258" width="380" height="290" rx="14" fill="#ffffff"/>
  <text x="1204" y="310" font-size="20" fill="#555">Continue learning</text>
  <text x="1204" y="356" font-size="26" font-weight="700" fill="#111">Set homework</text>
  <text x="1204" y="392" font-size="18" fill="#555">Module 2 · 6 min</text>
  <rect x="1204" y="448" width="200" height="56" rx="8" fill="#1a1a1a"/>
