d=\"invite-choice\"><input type=\"checkbox\" name=\"invite\" checked=\"\"> Send a welcome invite<\/label><label id=\"member-program\">Program<select name=\"program\"><option value=\"\">Not set<\/option><option value=\"foundation\">Foundation<\/option><option value=\"advanced\">Advanced<\/option><\/select><\/label><fieldset id=\"member-courses\"><legend>Courses this student can open<\/legend><label class=\"inline-choice\"><input type=\"checkbox\" name=\"courses\" value=\"learning\"> Learning how to learn<\/label><label class=\"inline-choice\"><input type=\"checkbox\" name=\"courses\" value=\"design\"> The foundations of design<\/label><label class=\"inline-choice\"><input type=\"checkbox\" name=\"courses\" value=\"digital\"> Digital skills for everyday life<\/label><label class=\"inline-choice\"><input type=\"checkbox\" name=\"courses\" value=\"draft-outline\"> Course outline (draft)<\/label><\/fieldset><p>Students open the courses ticked above. Administrators manage members and courses, review homework and answer support requests. You can't change your own access here.<\/p><div class=\"editor-actions\"><button class=\"primary\">Save approval<\/button><button type=\"button\" class=\"secondary danger\" id=\"remove-member\" hidden=\"\">Remove access<\/button><\/div><p id=\"member-status\" role=\"status\"><\/p><\/form><\/div><div class=\"report\"><div class=\"section-head\"><h2>Members <small>4 active \u00b7 0 inactive<\/small><\/h2><button type=\"button\" class=\"secondary\" id=\"add-member\">+ Add member<\/button><\/div><div class=\"table-scroll\"><table class=\"delivery-table member-table\"><thead><tr><th scope=\"col\">Email<\/th><th scope=\"col\">Role<\/th><th scope=\"col\">Program<\/th><th scope=\"col\">Status<\/th><th scope=\"col\">Signed in<\/th><th scope=\"col\"><span class=\"visually-hidden\">Actions<\/span><\/th><\/tr><\/thead><tbody><tr><td>other<wbr>@example.test<\/td><td data-label=\"Role\">Student<\/td><td data-label=\"Program\">Foundation<\/td><td data-label=\"Status\">Active<\/td><td data-label=\"Signed in\">Not yet<\/td><td><button type=\"button\" class=\"secondary\" data-edit=\"0\" aria-label=\"Edit other@example.test\">Edit<\/button><\/td><\/tr><tr><td>owner<wbr>@example.test<\/td><td data-label=\"Role\">Administrator<\/td><td data-label=\"Program\"><span class=\"muted\">\u2014<\/span><\/td><td data-label=\"Status\">Active<\/td><td data-label=\"Signed in\">Yes<\/td><td><span class=\"member-you\">You<\/span><\/td><\/tr><tr><td>reviewer<wbr>@example.test<\/td><td data-label=\"Role\">Administrator<\/td><td data-label=\"Program\"><span class=\"muted\">\u2014<\/span><\/td><td data-label=\"Status\">Active<\/td><td data-label=\"Signed in\">Not yet<\/td><td><button type=\"button\" class=\"secondary\" data-edit=\"2\" aria-label=\"Edit reviewer@example.test\">Edit<\/button><\/td><\/tr><tr><td>student<wbr>@example.test<\/td><td data-label=\"Role\">Student<\/td><td data-label=\"Program\">Advanced<\/td><td data-label=\"Status\">Active<\/td><td data-label=\"Signed in\">Yes<\/td><td><button type=\"button\" class=\"secondary\" data-edit=\"3\" aria-label=\"Edit student@example.test\">Edit<\/button><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/main><footer>Coursebook <span>A space to grow, at your own pace.<\/span><\/footer><\/div>\n<dialog id=\"create\" aria-labelledby=\"create-title\"><form id=\"course-form\"><button class=\"close\" type=\"button\" aria-label=\"Close\"><svg class=\"icon\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"><\/path><\/svg><\/button><h2 id=\"create-title\">Create a course<\/h2><label>Course title<input name=\"title\" autofocus=\"\" required=\"\" maxlength=\"80\" placeholder=\"e.g. Introduction to biology\"><\/label><label>Description<textarea name=\"description\" required=\"\" maxlength=\"30000\" placeholder=\"What will students learn?\"><\/textarea><\/label><button class=\"primary\">Create course <svg class=\"icon\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"><\/path><\/svg><\/button><\/form><\/dialog><div id=\"toast\" role=\"status\"><\/div><div class=\"rail-tip\" aria-hidden=\"true\"><\/div>\n","title":"Coursebook \u00b7 Your learning, in motion"}}}},"icons":{"x":"<svg class=\"icon\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"/><\/svg>","list":"<svg class=\"icon\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z\"/><\/svg>"}};
let role=location.hash==='#admin'?'admin':'student',route='dashboard',noteTimer;
function bar(){const b=document.createElement('div');b.className='demo-bar';b.setAttribute('role','group');b.setAttribute('aria-label','Demo view');
 b.innerHTML='<span>Demo</span>'+['student','admin'].map(r=>`<button type="button" data-demo-role="${r}" aria-pressed="${r===role}">${r==='admin'?'Admin':'Student'}</button>`).join('');return b;}
function show(focus){const p=DEMO.roles[role].pages[route];document.body.className=p.cls;document.body.innerHTML=p.html;document.body.append(bar());scrollTo(0,0);
 if(focus)document.querySelector('#main h1')?.setAttribute('tabindex','-1'),document.querySelector('#main h1')?.focus({preventScroll:true});}
function note(){const t=document.querySelector('#toast');if(!t)return;t.textContent='This is a demo. Only the sidebar tabs work.';t.style.display='block';clearTimeout(noteTimer);noteTimer=setTimeout(()=>t.style.display='none',2500);}
document.addEventListener('click',e=>{
 if(e.target.matches('input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),textarea,select,[contenteditable]'))return;
 const el=e.target.closest('a,button,label,summary,[role="button"],input[type="checkbox"],input[type="radio"],input[type="file"]');if(!el)return;
 const r=el.dataset.demoRole;if(r){e.preventDefault();if(r!==role){role=r;route='dashboard';history.replaceState(null,'','#'+r);show();}return;}
 const href=el.getAttribute('href')||'';
 if(el.matches('nav a, a.brand')&&DEMO.roles[role].pages[href.slice(1)]){e.preventDefault();route=href.slice(1);show(true);return;}
 if(el.matches('.menu-toggle')){const a=document.querySelector('aside'),open=!a.classList.contains('menu-open');a.classList.toggle('menu-open',open);el.setAttribute('aria-expanded',String(open));el.setAttribute('aria-label',open?'Close menu':'Open menu');el.innerHTML=open?DEMO.icons.x:DEMO.icons.list;return;}
 if(el.matches('.nav-collapse')){const on=!document.body.classList.contains('nav-collapsed');document.body.classList.toggle('nav-collapsed',on);el.setAttribute('aria-label',on?'Expand sidebar':'Collapse sidebar');return;}
 if(el.matches('.skip-link')){e.preventDefault();document.querySelector('#main')?.focus();return;}
 e.preventDefault();e.stopPropagation();note();
},true);
document.addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();note();},true);
addEventListener('hashchange',()=>{const r=location.hash==='#admin'?'admin':location.hash==='#student'?'student':null;if(r&&r!==role){role=r;route='dashboard';show();}});
show();
