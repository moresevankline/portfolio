<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticket Wallet sketch</title>
<style>
:root{--navy:#1c2c5b;--red:#d42a2a;--stock:#fbfbf8;--carbon:#5b3f8c}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--navy);font-family:Helvetica,Arial,sans-serif;color:var(--navy)}
.wallet{position:absolute;left:120px;top:70px;width:1200px;height:760px;display:grid;grid-template-columns:380px 1fr;gap:0}
.flap{background:#24386f;border:2px solid #31478a;padding:40px;color:#fff}
.flap h2{font-size:15px;letter-spacing:.2em}
.flap .route{margin-top:60px;font-size:54px;font-weight:800;line-height:1}
.coupon{background:var(--stock);padding:36px 44px;position:relative;border-left:3px dashed var(--navy)}
.head{display:flex;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:14px}
.head b{font-size:13px;letter-spacing:.18em}
h1{font-size:70px;font-weight:800;letter-spacing:-.01em;margin-top:22px;text-transform:uppercase;line-height:.92}
.pos{font-size:24px;margin-top:10px}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);margin-top:30px;border:1px solid var(--navy)}
.boxes div{border-right:1px solid var(--navy);padding:10px 12px;height:84px}
.boxes small{font-size:11px;letter-spacing:.14em;font-weight:700}
.boxes p{font-family:"Courier New",monospace;color:var(--carbon);font-size:24px;font-weight:700;margin-top:10px}
.fare{margin-top:26px;border:2px solid var(--navy);height:150px;padding:14px;font-size:18px;color:#4a4a4a}
.go{position:absolute;right:44px;bottom:36px;background:var(--red);color:#fff;font-weight:800;padding:18px 34px;font-size:20px;letter-spacing:.12em}
.void{position:absolute;right:70px;top:120px;border:4px solid var(--red);color:var(--red);font:800 34px "Courier New",monospace;padding:4px 14px;transform:rotate(8deg)}
</style></head><body>
<div class="wallet">
  <div class="flap"><h2>PASSENGER COUPON BOOK</h2><div class="route">WEB<br>→ SAP<br>SF</div></div>
  <div class="coupon">
    <div class="head"><b>COUPON 1 OF 4</b><b>NOT TRANSFERABLE</b></div>
    <h1>Evan Kline Mores</h1><div class="pos">Web developer · SAP SuccessFactors</div>
    <div class="void">VALID</div>
    <div class="boxes"><div><small>LEG 1</small><p>WEB</p></div><div><small>LEG 2</small><p>EC CORE</p></div><div><small>LEG 3</small><p>TIME OFF</p></div><div><small>LEG 4</small><p>REPORTS</p></div></div>
    <div class="fare">Message: tell me what you're building…</div>
    <div class="go">ISSUE</div>
  </div>
</div>
</body></html>
